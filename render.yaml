databases:
  - name: contraplano-db
    databaseName: contraplano
    user: contraplano_user
    plan: free
    region: ohio

services:
  - type: web
    name: contraplano-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: ohio

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contraplano-db
          property: connectionString

  - type: web
    name: contraplano-frontend
    env: static
    plan: free

    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: contraplano-backend
          envVarKey: RENDER_EXTERNAL_URL
